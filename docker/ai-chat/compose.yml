# Append after the existing web/localization overlays. No MCP service changes.
services:
  superset:
    environment:
      AI_CHAT_RUNTIME_ENABLED: 'true'
  ai-worker:
    extends:
      file: docker-compose-image-tag.yml
      service: superset
    image: ${FOCALBI_CHAT_IMAGE:-apachesuperset.docker.scarf.sh/apache/superset@sha256:5822dff49c41fd745ce33e38af502f9c64df30d133aeba148c5d89b35a1004ef}
    environment:
      AI_CHAT_RUNTIME_ENABLED: 'true'
    container_name: focal_ai_worker
    entrypoint: ['celery']
    command:
      - '-A'
      - 'superset.ai_runtime.worker:app'
      - 'worker'
      - '--beat'
      - '--queues=ai'
      - '--concurrency=4'
      - '--loglevel=INFO'
      - '--schedule=/tmp/focal-ai-beat'
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      disable: true
