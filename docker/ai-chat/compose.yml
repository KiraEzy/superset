# Append after the existing web/localization overlays. No MCP service changes.
services:
  superset:
    image: ${FOCALBI_CHAT_IMAGE:-focalbi-ai-sdk:20261025}
    environment:
      AI_CHAT_RUNTIME_ENABLED: 'true'
  ai-worker:
    extends:
      file: docker-compose-image-tag.yml
      service: superset
    image: ${FOCALBI_CHAT_IMAGE:-focalbi-ai-sdk:20261025}
    environment:
      AI_CHAT_RUNTIME_ENABLED: 'true'
    container_name: focal_ai_worker
    entrypoint: ['/opt/focal-ai/bin/python', '-m', 'celery']
    command:
      - '-A'
      - 'superset.ai_runtime.worker:app'
      - 'worker'
      - '--beat'
      - '--queues=ai'
      - '--concurrency=4'
      - '--loglevel=INFO'
      - '--schedule=/tmp/focal-ai-beat'
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      disable: true
